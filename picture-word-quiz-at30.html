<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AT-30｜看圖選英文單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#243653;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{background:white;color:#3155b6;font-weight:700;padding:18px 5%}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7998e8);color:white;border-radius:18px;padding:24px}.card{background:#fff;border:1px solid #dce4f2;border-radius:16px;padding:18px;margin-top:16px}button,.link{border:0;background:#3155b6;color:white;border-radius:12px;padding:13px;font:inherit;cursor:pointer}a{color:#3155b6}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.options button{min-height:64px;background:#eaf0ff;color:#203a78;font-weight:700}.options button:disabled{opacity:1}.options .correct{background:#d8f7e7;color:#125e37}.options .wrong{background:#ffe1e1;color:#a12828}.art{display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#eef4ff,#e4fbf5);border-radius:20px;min-height:215px;margin:14px 0}.art svg{width:min(100%,300px);height:200px}.muted{color:#63728a}.good{color:#187346;font-weight:700}.bad{color:#b43b35;font-weight:700}button:focus-visible{outline:3px solid #e7a936;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.progress{height:12px;background:#e4eaf5;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#4e75d6;transition:width .2s}#next{width:100%;margin-top:12px}select{padding:10px;border:1px solid #ccd7eb;border-radius:9px;font:inherit}@media(max-width:380px){.options{grid-template-columns:1fr}}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-30｜圖片單字遊戲</small><h1>看圖選英文單字</h1><p>觀察圖片，從四個英文單字中選出正確答案。每回合 10 題，題庫 20 個生活單字。</p></div><section class="card"><div class="row"><b id="counter">第 1 / 10 題</b><span id="points">本回合 0 分</span></div><div class="progress"><div id="bar"></div></div><div class="art" id="art" role="img" aria-label="題目插圖"></div><p class="muted" id="hint">這張圖片代表哪個英文單字？</p><div class="options" id="options"></div><p id="feedback" aria-live="polite"></p><button id="hear" class="link" hidden>🔊 聽正確英文發音</button><button id="next" hidden>下一題</button><p id="best" class="muted"></p></section><section class="card"><h2>單字主題</h2><p>食物、購物、交通、生活、職場。圖片使用網站內建 SVG 插畫，不依賴外部圖片網址；圖案在不同裝置的外觀可能略有差異。</p><p class="muted">成績儲存在目前瀏覽器，並支援學習資料 JSON 備份。遊戲分數只代表單字辨識表現。</p></section></main><script>
const WORDS=[{"en":"apple","zh":"蘋果","emoji":"🍎","group":"food"},{"en":"banana","zh":"香蕉","emoji":"🍌","group":"food"},{"en":"bread","zh":"麵包","emoji":"🍞","group":"food"},{"en":"coffee","zh":"咖啡","emoji":"☕","group":"food"},{"en":"water","zh":"水","emoji":"💧","group":"food"},{"en":"pizza","zh":"披薩","emoji":"🍕","group":"food"},{"en":"shirt","zh":"襯衫","emoji":"👕","group":"shopping"},{"en":"shoes","zh":"鞋子","emoji":"👟","group":"shopping"},{"en":"bag","zh":"包包","emoji":"👜","group":"shopping"},{"en":"train","zh":"火車","emoji":"🚆","group":"travel"},{"en":"airplane","zh":"飛機","emoji":"✈️","group":"travel"},{"en":"hotel","zh":"飯店","emoji":"🏨","group":"travel"},{"en":"doctor","zh":"醫生","emoji":"👩‍⚕️","group":"daily"},{"en":"phone","zh":"電話","emoji":"📱","group":"daily"},{"en":"computer","zh":"電腦","emoji":"💻","group":"work"},{"en":"clock","zh":"時鐘","emoji":"🕒","group":"daily"},{"en":"car","zh":"汽車","emoji":"🚗","group":"travel"},{"en":"book","zh":"書","emoji":"📖","group":"daily"},{"en":"chair","zh":"椅子","emoji":"🪑","group":"daily"},{"en":"key","zh":"鑰匙","emoji":"🔑","group":"daily"}];
const KEY='adultEnglishPictureQuizBest',TOTAL=10,el=id=>document.getElementById(id);let questions=[],idx=0,score=0,answered=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function svgFor(item){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="'+item.zh+'插畫"><rect x="9" y="9" width="282" height="182" rx="22" fill="#ffffff" opacity=".74"/><circle cx="150" cy="95" r="73" fill="#e4efff"/><text x="150" y="131" font-size="91" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif">'+item.emoji+'</text></svg>';return svg}
function best(){try{return Math.max(0,Number(localStorage.getItem(KEY))||0)}catch(e){return 0}}
function save(v){try{if(v>best())localStorage.setItem(KEY,String(v))}catch(e){}}
function start(){questions=shuffle(WORDS).slice(0,TOTAL).map(item=>({item,choices:shuffle([item,...shuffle(WORDS.filter(w=>w.en!==item.en)).slice(0,3)])}));idx=0;score=0;render()}
function render(){if(idx>=TOTAL){const percent=Math.round(score/TOTAL*100);save(percent);el('counter').textContent='本回合完成';el('points').textContent='答對 '+score+' / '+TOTAL+' 題';el('bar').style.width='100%';el('art').innerHTML='<svg viewBox="0 0 300 200" aria-label="完成"><rect width="300" height="200" rx="24" fill="#e4f7eb"/><text x="150" y="125" text-anchor="middle" font-size="90">🏆</text></svg>';el('options').replaceChildren();el('hint').textContent='本回合已完成';el('feedback').textContent='本次得分：'+percent+' 分；歷史最佳：'+best()+' 分';el('feedback').className='good';el('hear').hidden=true;el('next').hidden=false;el('next').textContent='再玩一回合';el('best').textContent='最佳成績：'+best()+' 分';return}
answered=false;const q=questions[idx];el('counter').textContent='第 '+(idx+1)+' / '+TOTAL+' 題';el('points').textContent='本回合 '+score+' 分';el('bar').style.width=(idx/TOTAL*100)+'%';el('art').innerHTML=svgFor(q.item);el('art').setAttribute('aria-label',q.item.zh+'插畫');el('hint').textContent='圖片代表哪個英文單字？';el('feedback').textContent='';el('feedback').className='';el('hear').hidden=true;el('next').hidden=true;const wrap=el('options');wrap.replaceChildren();q.choices.forEach(w=>{const b=document.createElement('button');b.textContent=w.en;b.addEventListener('click',()=>choose(w.en));wrap.appendChild(b)});el('best').textContent='歷史最佳：'+best()+' 分'}
function choose(answer){if(answered)return;answered=true;const item=questions[idx].item,ok=answer===item.en;if(ok)score++;for(const b of el('options').children){b.disabled=true;if(b.textContent===item.en)b.classList.add('correct');else if(b.textContent===answer)b.classList.add('wrong')}el('feedback').textContent=(ok?'答對了！':'再記住這個單字：')+' '+item.en+'（'+item.zh+'）';el('feedback').className=ok?'good':'bad';el('points').textContent='本回合 '+score+' 分';el('hear').hidden=false;el('next').hidden=false;el('next').textContent=idx===TOTAL-1?'查看成績':'下一題'}
function speak(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(questions[idx].item.en);u.lang='en-US';u.rate=.9;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase()==='en-us');if(voices.length)u.voice=voices[0];speechSynthesis.speak(u)}
el('next').addEventListener('click',()=>{if(idx>=TOTAL)start();else{idx++;render()}});el('hear').addEventListener('click',speak);document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});start();
</script></body></html>
