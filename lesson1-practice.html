<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 1｜四問四答</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#263651;font:16px system-ui,-apple-system,sans-serif}header{background:#fff;padding:18px 5%;color:#3155b6;font-weight:700}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7391e5);color:#fff;padding:24px;border-radius:18px}.card{background:#fff;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:15px}input{width:100%;border:1px solid #bfcce3;border-radius:9px;padding:13px;font:inherit}button,.link{background:#3155b6;color:white;border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;margin:6px 5px 6px 0}.link{display:inline-block;text-decoration:none}.muted{color:#61718a}p{line-height:1.6}.question{padding:15px 0;border-bottom:1px solid #edf0f6}.good{color:#166c42}.warn{color:#9a5c0c}</style></head><body><header>Everyday English · 成人英文</header><main><a class="link" href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>Book 1 · Lesson 1 · AT-08</small><h1>What's Your Name?</h1><p>四問四答｜用英文介紹自己</p></div><section class="card"><h2>學習說明</h2><p>根據教材第一課的四個提問主題，使用原創範例回答。輸入可用虛構姓名、地址和電話，避免填寫真實個資。</p><p class="muted">練習答案以基本句型檢查，不評判個人資料真偽；語音播放取決於瀏覽器支援。</p></section><section class="card"><h2>✍️ 四題回答練習</h2><div id="items"></div><button id="check">檢查四題回答</button><button id="example">填入示範答案</button><button id="clear">清空輸入</button><p id="feedback" aria-live="polite"></p></section><section class="card"><h2>📈 練習紀錄</h2><p id="record"></p><p class="muted">僅儲存完成題數，不保存你輸入的姓名、地址或電話。第一課及補充單元的測驗成績不受影響。</p></section></main><script>
const qs=[{q:"What's your name?",zh:"你叫什麼名字？",hint:"My name is Alex.",test:/^(my name is|i am|i'm)\s+\S+/i},{q:"What's your address?",zh:"你的地址是什麼？",hint:"My address is 12 Green Street.",test:/^(my address is|i live at)\s+\S+/i},{q:"What's your phone number?",zh:"你的電話號碼是什麼？",hint:"My phone number is 555-0142.",test:/^(my phone number is|it's|it is)\s+.*\d/i},{q:"Where are you from?",zh:"你來自哪裡？",hint:"I'm from Taipei.",test:/^(i am from|i'm from)\s+\S+/i}];
const el=id=>document.getElementById(id);el('items').innerHTML=qs.map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+q.q+'</b><button data-say="'+i+'">▶ 朗讀問題</button><p class="muted">'+q.zh+'｜例如：'+q.hint+'</p><label for="answer'+i+'">你的英文回答</label><input id="answer'+i+'" autocomplete="off" placeholder="請輸入英文完整句子"><p id="result'+i+'" aria-live="polite"></p></div>').join('');
function speak(t){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
el('items').addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(qs[Number(b.dataset.say)].q)});
function record(){let n=null;try{n=localStorage.getItem('adultEnglishL1PracticeBest')}catch(e){}el('record').textContent='四問四答最佳符合句型數：'+(n===null?'尚未練習':n+' / 4')}
el('check').addEventListener('click',()=>{let n=0;qs.forEach((q,i)=>{const answer=el('answer'+i).value.trim().replace(/[.!?]+$/,'');const ok=q.test.test(answer);if(ok)n++;el('result'+i).textContent=ok?'✓ 句型符合':'請參考範例補上完整句型';el('result'+i).className=ok?'good':'warn'});el('feedback').textContent='本次句型符合 '+n+' / 4 題。這是基本句型檢查，非完整文法批改。';try{localStorage.setItem('adultEnglishL1PracticeBest',String(Math.max(n,Number(localStorage.getItem('adultEnglishL1PracticeBest')||0))))}catch(e){}record()});
el('example').addEventListener('click',()=>qs.forEach((q,i)=>el('answer'+i).value=q.hint));
el('clear').addEventListener('click',()=>{qs.forEach((q,i)=>{el('answer'+i).value='';el('result'+i).textContent=''});el('feedback').textContent=''});
record();
</script></body></html>
