<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AT-33｜Side by Side 彩色互動圖文課</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f7ff;color:#12345e;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:2px}header{background:linear-gradient(100deg,#0753a4,#1676ce);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}header b{font-size:clamp(18px,2vw,26px)}header small{font-size:14px}.nav{display:flex;gap:8px;align-items:center}.nav button{background:#e6f2ff;border:0;color:#0c57aa;border-radius:10px;padding:9px 15px;font-weight:800}.layout{max-width:1600px;margin:auto;padding:12px;display:grid;grid-template-columns:220px minmax(0,1.55fr) minmax(330px,1fr);gap:12px}.sidebar,.panel{background:white;border:2px solid #d8e9ff;border-radius:16px;overflow:hidden}.sidebar{padding:12px}.sidebar h3{margin:4px 0 10px;background:#dbeeff;padding:10px;border-radius:10px}.sidebtn{width:100%;text-align:left;border:0;background:white;padding:11px;border-bottom:1px solid #e5eef9;color:#143866;font-weight:650}.sidebtn.selected{background:#a7d8ff;border-radius:10px;color:#063f86}.sidebar .muted{font-size:13px;color:#627d9e}.column{display:flex;flex-direction:column;gap:12px;min-width:0}.section-head{background:linear-gradient(90deg,#d6eaff,#edf7ff);padding:11px 13px;font-size:19px;font-weight:850;color:#0756a8}.section-head span{background:#0665bb;color:#fff;border-radius:10px;padding:5px 11px;margin-right:9px}.section-head.purple{background:linear-gradient(90deg,#e2d9ff,#f8f4ff)}.section-head.purple span{background:#7048c7}.body{padding:12px}.scene{background:linear-gradient(#bde7ff 0 65%,#8fcf91 65%);border-radius:14px;min-height:260px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:16px}.scene:before{display:none;content:"";position:absolute;bottom:15%;left:0;right:0;height:35px;background:#d9e7ee;opacity:.7}.bubbleline{z-index:1;display:flex;gap:8px;width:100%;justify-content:space-between}.bubble{background:#fff;border:2px solid #26425d;border-radius:35px;padding:12px 14px;text-align:center;max-width:48%;font-size:clamp(14px,1.5vw,20px);font-weight:750}.people{z-index:1;display:flex;align-items:end;justify-content:center;width:100%;height:185px;line-height:1}.people svg{width:100%;height:100%;max-width:560px;filter:drop-shadow(1px 3px 2px #2c628744)}.person{filter:drop-shadow(2px 5px 2px #387b7755)}.vocab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.word{border:2px solid #d9e5f4;border-radius:12px;background:#fff;overflow:hidden;text-align:center;padding:5px 3px 9px;min-width:0}.word svg{display:block;width:100%;height:86px}.word strong{display:block;font-size:clamp(12px,1.35vw,17px);overflow-wrap:anywhere}.word small{font-size:12px}.word:hover{background:#e7f4ff}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:10px}.controls button,.action{border:0;background:#0873cf;color:white;border-radius:10px;padding:10px 13px;font-weight:700}.controls .green{background:#179b48}.controls .purple{background:#7951c5}.sentences{list-style:none;padding:0;margin:0}.sentences li{padding:10px 12px;border-bottom:1px solid #e8edf7;background:#fff9e9;display:flex;justify-content:space-between;gap:8px;align-items:center}.sentences li button{background:#e7f1ff;border:0;border-radius:8px;padding:8px}.grammar{padding:15px;background:#faf8ff;font-size:16px}.grammar table{width:100%;border-collapse:collapse;margin-top:12px}.grammar td,.grammar th{border:1px solid #d5e1f2;padding:8px;text-align:left}.grammar th{background:#d7e9ff}.quiz{padding:12px}.quiz-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.quiz-art{background:#e6f4ff;border:2px solid #b5d5f4;border-radius:14px;min-height:160px;display:flex;align-items:center;justify-content:center}.quiz-art svg{width:100%;max-height:190px}.answers{display:grid;gap:8px}.answers button{background:white;border:2px solid #d0e0f1;border-radius:10px;padding:12px;text-align:left;font-weight:750}.answers button.correct{background:#c8f8ce;border-color:#67cf79}.answers button.wrong{background:#ffe0e0;border-color:#e58c8c}.answers button:disabled{opacity:1}.result{background:#e4f9dd;border-radius:10px;padding:12px;margin-top:10px;font-weight:750;min-height:46px}.bottom{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}.bottom button{border:0;background:#0873cf;color:#fff;padding:10px 16px;border-radius:9px;font-weight:800}.bottom button:disabled{opacity:.5}.small{font-size:13px;color:#6c7e97}.foot{max-width:1600px;margin:0 auto 15px;padding:0 16px;color:#6b7b90;font-size:12px}
@media(max-width:1100px){.layout{grid-template-columns:180px 1fr}.right{grid-column:2}.vocab{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:690px){.layout{display:block;padding:8px}.sidebar{margin-bottom:9px}.sidebar h3{font-size:15px}.sidebar .sidebtn{width:auto;border:1px solid #d9e7f4;border-radius:9px;margin:3px;padding:8px}.column{margin-bottom:9px}.vocab{grid-template-columns:repeat(3,minmax(0,1fr))}.scene{min-height:220px}.people{font-size:80px}.bubble{font-size:14px}.quiz-row{grid-template-columns:1fr}.right{grid-column:auto}}
.people{height:auto!important}.scene{background:#e9efe3;gap:12px}.vocab{grid-template-columns:repeat(3,minmax(0,1fr))}.word{padding:0 0 9px}.word .learning-picture{border-radius:8px 8px 0 0}.word strong{margin-top:7px}@media(max-width:690px){.vocab{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><link rel="stylesheet" href="./assets/at35-images.css"><script src="./assets/at35-data.js"></script><script src="./assets/at35-images.js"></script></head><body><div style="padding:12px;background:#e1eddd;text-align:center"><a href="./at35-picture-quiz.html">開啟 AT-35 寫實圖像、聽力與跟讀課程 →</a></div><header><b>📖 成人英文學習 <small>｜Side by Side 圖文課程</small></b><div class="nav"><span id="topUnit">Book 1 · Unit 1</span><button id="prevUnit" aria-label="上一單元">❮</button><button id="nextUnit" aria-label="下一單元">❯</button></div></header><div class="layout"><aside class="sidebar"><h3>📚 課程選單</h3><b>Book 1｜第一冊</b><div id="book1"></div><h3>Book 2｜第二冊</h3><div id="book2"></div><p class="muted">目前開放三個已對照 PDF 的單元，後續逐步擴充。</p><p><a href="./dashboard.html">← 返回課程總覽</a></p></aside><div class="column"><section class="panel"><div class="section-head"><span>A</span>情境對話 Dialogue</div><div class="body"><div class="scene"><div class="bubbleline"><div class="bubble" id="dialogA"></div><div class="bubble" id="dialogB"></div></div><div class="people" id="sceneIllustration" aria-label="情境插畫"></div></div><p class="small" id="dialogZh"></p></div></section><section class="panel"><div class="section-head"><span>D</span>圖像單字 Vocabulary</div><div class="body"><div id="vocab" class="vocab"></div></div><div class="controls"><button id="playDialogue">🔊 播放對話</button><button id="slowDialogue">🐢 慢速播放</button><button id="practiceSpeaking">🎤 跟讀練習</button><button id="ab" class="purple">A / B 比較</button><button id="wordAudio" class="green">▶ 單字發音</button></div><p id="speechNote" class="small" style="padding:0 12px" aria-live="polite"></p></section></div><div class="column right"><section class="panel"><div class="section-head"><span>B</span>重要句型 Key Sentences</div><ul id="sentences" class="sentences"></ul></section><section class="panel"><div class="section-head purple"><span>C</span>文法重點 Grammar</div><div id="grammar" class="grammar"></div></section><section class="panel"><div class="section-head"><span>E</span>看圖選單字 Practice <small id="counter" style="float:right"></small></div><div class="quiz"><div class="quiz-row"><div class="quiz-art" id="quizArt"></div><div class="answers" id="answers"></div></div><div class="bottom"><button id="hear">🔊 聽發音</button><span id="score"></span></div><div class="result" id="feedback" aria-live="polite">選擇圖片對應的英文單字</div><div class="bottom"><span id="best" class="small"></span><button id="next" disabled>下一題 ➜</button></div></div></section></div></div><div class="foot">圖像與對話為原創練習素材，依使用者提供的教材主題編排；不直接複製原書插圖。進度保存在此裝置。</div><script>
const UNITS=[{"book":1,"unit":1,"heading":"To Be: Introduction","themes":["Personal Information","Meeting People"],"grammar":"am / is / are","examples":[["I am an engineer.","我是一名工程師。"],["She is my colleague.","她是我的同事。"],["Are you new here?","你是新來的嗎？"]],"words":[["name","姓名","🏷️"],["address","地址","🏠"],["telephone","電話","☎️"],["alphabet","字母","🔤"],["number","數字","🔢"]]},{"book":1,"unit":2,"heading":"To Be + Location / Subject Pronouns","themes":["Classroom Objects","Rooms in the Home","Places Around Town"],"grammar":"I / you / he / she / it / we / they + am / is / are","examples":[["The book is on the desk.","書在桌上。"],["They are in the kitchen.","他們在廚房。"],["Where is the library?","圖書館在哪裡？"]],"words":[["pen","原子筆","🖊️"],["pencil","鉛筆","✏️"],["book","書","📚"],["desk","書桌","🪑"],["computer","電腦","💻"],["bank","銀行","🏦"],["supermarket","超市","🛒"],["post office","郵局","📮"],["restaurant","餐廳","🍽️"],["library","圖書館","📚"],["living room","客廳","🛋️"],["dining room","飯廳","🍽️"],["kitchen","廚房","🍳"],["bedroom","臥室","🛏️"],["bathroom","浴室","🛁"]]},{"book":2,"unit":1,"heading":"Review of Tenses / Like to / Time Expressions","themes":["Present, Past, and Future Actions","Birthdays and Gifts","Friendships"],"grammar":"present / present continuous / past / going to / like to","examples":[["I work every day.","我每天工作。"],["I am studying English now.","我現在正在學英文。"],["I visited my friend yesterday.","我昨天拜訪朋友。"],["I am going to travel next week.","我下週打算旅行。"]],"words":[["Sunday","星期日","📅"],["Monday","星期一","📅"],["Tuesday","星期二","📅"],["Wednesday","星期三","📅"],["Thursday","星期四","📅"],["Friday","星期五","📅"],["Saturday","星期六","📅"],["January","一月","🗓️"],["February","二月","🗓️"],["March","三月","🗓️"],["April","四月","🗓️"],["May","五月","🗓️"],["June","六月","🗓️"],["July","七月","🗓️"],["August","八月","🗓️"],["September","九月","🗓️"],["October","十月","🗓️"],["November","十一月","🗓️"],["December","十二月","🗓️"],["spring","春天","🌸"],["summer","夏天","☀️"],["fall","秋天","🍂"],["winter","冬天","⛄"]]}],KEY='adultEnglishSbsAlignedV1',el=id=>document.getElementById(id);let current=0,questions=[],index=0,points=0,locked=false;

function illustrated(word,emoji,description){return learningImage(word,'觀察圖片，選擇對應英文')}

const DIALOGS=[[["Hello! I'm Alex.","Hi! I'm Mia."],["你好！我是 Alex。","嗨！我是 Mia。"]],[["Where are they?","They are in the library."],["他們在哪裡？","他們在圖書館。"]],[["What did you do yesterday?","I visited my friend."],["你昨天做了什麼？","我去拜訪朋友。"]]];
let voiceMode=0;
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function persist(){try{const v=saved(),u=UNITS[current],k=u.book+'-'+u.unit;v[k]=Math.max(Number(v[k])||0,Math.round(points/questions.length*100));localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function speak(text,rate=0.9,alternate=false){if(!('speechSynthesis'in window)){el('speechNote').textContent='此瀏覽器不支援語音播放';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));if(voices.length)u.voice=voices[(alternate?1:voiceMode)%voices.length];speechSynthesis.speak(u)}
function sayDialog(rate=0.9){const lines=DIALOGS[current][0];speak(lines.join(' ... '),rate)}
function buildMenus(){for(const id of ['book1','book2'])el(id).replaceChildren();UNITS.forEach((u,i)=>{const b=document.createElement('button');b.className='sidebtn'+(i===current?' selected':'');b.textContent='Unit '+u.unit+'　'+u.themes[0];b.addEventListener('click',()=>setUnit(i));el('book'+u.book).appendChild(b)})}
function sceneArt(i){return learningImage(['meeting','library','visit'][i],['認識新朋友','圖書館','拜訪朋友'][i])}
function setUnit(i){if(i<0||i>=UNITS.length)return;current=i;const u=UNITS[i];buildMenus();el('topUnit').textContent='Book '+u.book+' · Unit '+u.unit;el('prevUnit').disabled=i===0;el('nextUnit').disabled=i===UNITS.length-1;el('dialogA').textContent=DIALOGS[i][0][0];el('dialogB').textContent=DIALOGS[i][0][1];el('dialogZh').textContent=DIALOGS[i][1].join('　');el('sceneIllustration').replaceChildren(sceneArt(i));el('sentences').replaceChildren();u.examples.forEach(([en,zh])=>{const li=document.createElement('li'),txt=document.createElement('span'),b=document.createElement('button');txt.textContent=en+'　'+zh;b.textContent='🔊';b.setAttribute('aria-label','播放 '+en);b.addEventListener('click',()=>speak(en));li.append(txt,b);el('sentences').appendChild(li)});el('grammar').replaceChildren();const p=document.createElement('p');p.textContent='文法重點：'+u.grammar;el('grammar').appendChild(p);const t=document.createElement('table');const rows=i===0?[['主詞','Be 動詞'],['I','am'],['You / We / They','are'],['He / She / It','is']]:i===1?[['主詞','Be 動詞'],['I','am'],['He / She / It','is'],['You / We / They','are']]:[['時間','原創例句'],['現在','I work every day.'],['過去','I visited my friend.'],['未來','I am going to travel.']];rows.forEach((r,j)=>{const tr=document.createElement('tr');r.forEach(c=>{const cell=document.createElement(j===0?'th':'td');cell.textContent=c;tr.appendChild(cell)});t.appendChild(tr)});el('grammar').appendChild(t);el('vocab').replaceChildren();u.words.forEach(([en,zh,emoji])=>{const b=document.createElement('button');b.className='word';b.append(illustrated(en,emoji,zh+'插畫'));const strong=document.createElement('strong');strong.textContent=en;const small=document.createElement('small');small.textContent=zh;b.append(strong,small);b.addEventListener('click',()=>speak(en));el('vocab').appendChild(b)});questions=shuffle(u.words).slice(0,Math.min(10,u.words.length));index=0;points=0;el('speechNote').textContent='點選單字卡可播放英文發音';render()}
function render(){const u=UNITS[current],q=questions[index];if(!q){persist();el('counter').textContent='完成';el('quizArt').replaceChildren(illustrated('','🏆','完成'));el('answers').replaceChildren();el('feedback').textContent='本回合 '+Math.round(points/questions.length*100)+' 分';el('next').disabled=false;el('next').textContent='再玩一次';el('hear').disabled=true;el('best').textContent='最佳成績 '+(saved()[u.book+'-'+u.unit]||0)+' 分';return}locked=false;el('counter').textContent=(index+1)+' / '+questions.length;el('score').textContent=points+' 分';el('quizArt').replaceChildren(illustrated(q[0],q[2],q[1]+'圖片'));el('feedback').textContent='請選出圖片對應的英文單字';el('next').disabled=true;el('next').textContent='下一題 ➜';el('hear').disabled=false;el('best').textContent='最佳成績 '+(saved()[u.book+'-'+u.unit]||0)+' 分';el('answers').replaceChildren();shuffle([q,...shuffle(u.words.filter(w=>w[0]!==q[0])).slice(0,3)]).forEach(w=>{const b=document.createElement('button');b.textContent=w[0];b.addEventListener('click',()=>{if(locked)return;const art=document.getElementById('quizArt')||document.getElementById('questionArt');const img=art?.querySelector('img');if(img&&(!img.complete||!img.naturalWidth))return;locked=true;if(w[0]===q[0])points++;el('score').textContent=points+' 分';el('feedback').textContent=(w[0]===q[0]?'✔ 答對了！':'正確答案：')+' '+q[0]+' = '+q[1];for(const btn of el('answers').children){btn.disabled=true;if(btn.textContent===q[0])btn.className='correct';else if(btn===b)btn.className='wrong'}el('next').disabled=false});el('answers').appendChild(b)})}
el('prevUnit').addEventListener('click',()=>setUnit(current-1));el('nextUnit').addEventListener('click',()=>setUnit(current+1));el('next').addEventListener('click',()=>{if(index>=questions.length){setUnit(current);return}if(!locked)return;index++;render()});el('hear').addEventListener('click',()=>{if(questions[index])speak(questions[index][0])});el('playDialogue').addEventListener('click',()=>sayDialog());el('slowDialogue').addEventListener('click',()=>sayDialog(.65));el('wordAudio').addEventListener('click',()=>{const u=UNITS[current];speak(u.words.slice(0,6).map(w=>w[0]).join(' ... '),.8)});el('ab').addEventListener('click',()=>{voiceMode=1-voiceMode;sayDialog();el('speechNote').textContent='語音模式 '+(voiceMode?'B':'A')+'：實際可用聲線依裝置而異'});el('practiceSpeaking').addEventListener('click',()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){el('speechNote').textContent='目前瀏覽器不支援語音辨識，請先聽音跟讀';return}const r=new R();r.lang='en-US';r.onresult=e=>{el('speechNote').textContent='辨識文字：'+e.results[0][0].transcript+'（僅顯示辨識內容，非發音評分）'};r.onerror=e=>el('speechNote').textContent='語音辨識未完成：'+e.error;r.start()});setUnit(0);
</script></body></html>
