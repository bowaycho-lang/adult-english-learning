function illustrated(word,emoji,description){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 300 180');svg.setAttribute('role','img');svg.setAttribute('aria-label',description);svg.innerHTML='<rect x="8" y="8" width="284" height="164" rx="24" fill="#fff"/><circle cx="150" cy="90" r="74" fill="#e6f2ff"/>'+(ORIGINAL_ART[word]||'<text x="150" y="123" text-anchor="middle" font-size="91" font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif">'+emoji+'</text>');return svg}

const DIALOGS=[[["Hello! I'm Alex.","Hi! I'm Mia."],["你好！我是 Alex。","嗨！我是 Mia。"]],[["Where is the library?","It's next to the bank."],["圖書館在哪裡？","在銀行旁邊。"]],[["What did you do yesterday?","I visited my friend."],["你昨天做了什麼？","我去拜訪朋友。"]]];
let voiceMode=0;
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function persist(){try{const v=saved(),u=UNITS[current],k=u.book+'-'+u.unit;v[k]=Math.max(Number(v[k])||0,Math.round(points/questions.length*100));localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function speak(text,rate=0.9,alternate=false){if(!('speechSynthesis'in window)){el('speechNote').textContent='此瀏覽器不支援語音播放';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));if(voices.length)u.voice=voices[(alternate?1:voiceMode)%voices.length];speechSynthesis.speak(u)}
function sayDialog(rate=0.9){const lines=DIALOGS[current][0];speak(lines.join(' ... '),rate)}
function buildMenus(){for(const id of ['book1','book2'])el(id).replaceChildren();UNITS.forEach((u,i)=>{const b=document.createElement('button');b.className='sidebtn'+(i===current?' selected':'');b.textContent='Unit '+u.unit+'　'+u.themes[0];b.addEventListener('click',()=>setUnit(i));el('book'+u.book).appendChild(b)})}
function setUnit(i){if(i<0||i>=UNITS.length)return;current=i;const u=UNITS[i];buildMenus();el('topUnit').textContent='Book '+u.book+' · Unit '+u.unit;el('prevUnit').disabled=i===0;el('nextUnit').disabled=i===UNITS.length-1;el('dialogA').textContent=DIALOGS[i][0][0];el('dialogB').textContent=DIALOGS[i][0][1];el('dialogZh').textContent=DIALOGS[i][1].join('　');el('sentences').replaceChildren();u.examples.forEach(([en,zh])=>{const li=document.createElement('li'),txt=document.createElement('span'),b=document.createElement('button');txt.textContent=en+'　'+zh;b.textContent='🔊';b.setAttribute('aria-label','播放 '+en);b.addEventListener('click',()=>speak(en));li.append(txt,b);el('sentences').appendChild(li)});el('grammar').replaceChildren();const p=document.createElement('p');p.textContent='文法重點：'+u.grammar;el('grammar').appendChild(p);const t=document.createElement('table');const rows=i===0?[['主詞','Be 動詞'],['I','am'],['You / We / They','are'],['He / She / It','is']]:i===1?[['主詞','Be 動詞'],['I','am'],['He / She / It','is'],['You / We / They','are']]:[['時間','原創例句'],['現在','I work every day.'],['過去','I visited my friend.'],['未來','I am going to travel.']];rows.forEach((r,j)=>{const tr=document.createElement('tr');r.forEach(c=>{const cell=document.createElement(j===0?'th':'td');cell.textContent=c;tr.appendChild(cell)});t.appendChild(tr)});el('grammar').appendChild(t);el('vocab').replaceChildren();u.words.forEach(([en,zh,emoji])=>{const b=document.createElement('button');b.className='word';b.append(illustrated(en,emoji,zh+'插畫'));const strong=document.createElement('strong');strong.textContent=en;const small=document.createElement('small');small.textContent=zh;b.append(strong,small);b.addEventListener('click',()=>speak(en));el('vocab').appendChild(b)});questions=shuffle(u.words).slice(0,Math.min(10,u.words.length));index=0;points=0;el('speechNote').textContent='點選單字卡可播放英文發音';render()}
function render(){const u=UNITS[current],q=questions[index];if(!q){persist();el('counter').textContent='完成';el('quizArt').replaceChildren(illustrated('','🏆','完成'));el('answers').replaceChildren();el('feedback').textContent='本回合 '+Math.round(points/questions.length*100)+' 分';el('next').disabled=false;el('next').textContent='再玩一次';el('hear').disabled=true;el('best').textContent='最佳成績 '+(saved()[u.book+'-'+u.unit]||0)+' 分';return}locked=false;el('counter').textContent=(index+1)+' / '+questions.length;el('score').textContent=points+' 分';el('quizArt').replaceChildren(illustrated(q[0],q[2],q[1]+'圖片'));el('feedback').textContent='請選出圖片對應的英文單字';el('next').disabled=true;el('next').textContent='下一題 ➜';el('hear').disabled=false;el('best').textContent='最佳成績 '+(saved()[u.book+'-'+u.unit]||0)+' 分';el('answers').replaceChildren();shuffle([q,...shuffle(u.words.filter(w=>w[0]!==q[0])).slice(0,3)]).forEach(w=>{const b=document.createElement('button');b.textContent=w[0];b.addEventListener('click',()=>{if(locked)return;locked=true;if(w[0]===q[0])points++;el('score').textContent=points+' 分';el('feedback').textContent=(w[0]===q[0]?'✔ 答對了！':'正確答案：')+' '+q[0]+' = '+q[1];for(const btn of el('answers').children){btn.disabled=true;if(btn.textContent===q[0])btn.className='correct';else if(btn===b)btn.className='wrong'}el('next').disabled=false});el('answers').appendChild(b)})}
el('prevUnit').addEventListener('click',()=>setUnit(current-1));el('nextUnit').addEventListener('click',()=>setUnit(current+1));el('next').addEventListener('click',()=>{if(index>=questions.length){setUnit(current);return}if(!locked)return;index++;render()});el('hear').addEventListener('click',()=>{if(questions[index])speak(questions[index][0])});el('playDialogue').addEventListener('click',()=>sayDialog());el('slowDialogue').addEventListener('click',()=>sayDialog(.65));el('wordAudio').addEventListener('click',()=>{const u=UNITS[current];speak(u.words.slice(0,6).map(w=>w[0]).join(' ... '),.8)});el('ab').addEventListener('click',()=>{voiceMode=1-voiceMode;sayDialog();el('speechNote').textContent='語音模式 '+(voiceMode?'B':'A')+'：實際可用聲線依裝置而異'});el('practiceSpeaking').addEventListener('click',()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){el('speechNote').textContent='目前瀏覽器不支援語音辨識，請先聽音跟讀';return}const r=new R();r.lang='en-US';r.onresult=e=>{el('speechNote').textContent='辨識文字：'+e.results[0][0].transcript+'（僅顯示辨識內容，非發音評分）'};r.onerror=e=>el('speechNote').textContent='語音辨識未完成：'+e.error;r.start()});setUnit(0);
</script></body></html>
