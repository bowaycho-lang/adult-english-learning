<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 1｜英文聽寫</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#263651;font:16px system-ui,-apple-system,sans-serif}header{background:#fff;padding:18px 5%;color:#3155b6;font-weight:700}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7391e5);color:white;padding:24px;border-radius:18px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:15px}.link,button{display:inline-block;background:#3155b6;color:white;border:0;border-radius:10px;padding:11px 14px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7eeff;color:#3155b6}input{width:100%;padding:13px;border:1px solid #bfcce3;border-radius:9px;font:inherit}.muted{color:#63728c}.good{color:#176a40}.bad{color:#9a4c27}p{line-height:1.6}button:disabled{opacity:.6}</style></head><body><header>Everyday English · 成人英文</header><main><a class="link" href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>Book 1 · Lesson 1 · AT-09</small><h1>Listen & Type</h1><p>英文聽力與聽寫｜五題練習</p></div><section class="card"><h2>使用方法</h2><p>先按播放，聽英文句子，再將聽到的內容輸入文字框。可以使用正常或慢速播放。</p><p class="muted">採用瀏覽器內建語音，實際發音取決於裝置語音套件；不需輸入真實個人資料。</p></section><section class="card"><p id="counter"></p><button id="normal">▶ 正常播放</button><button class="secondary" id="slow">▶ 慢速播放</button><p><label for="answer">聽到的英文句子</label></p><input id="answer" autocomplete="off" autocapitalize="sentences" placeholder="請輸入英文句子"><p><button id="check">檢查答案</button><button id="next" class="secondary" hidden>下一題</button></p><p id="feedback" aria-live="polite"></p></section><section class="card"><h2>📈 聽寫紀錄</h2><p id="record"></p><p class="muted">僅保存本單元最佳得分，不儲存輸入的答案。原有單元成績不會被清除。</p><button id="restart" class="secondary">重新開始</button></section></main><script>
function trackMistake(item,ok){try{const k='adultEnglishMistakesV1';let a=JSON.parse(localStorage.getItem(k)||'[]');if(!Array.isArray(a))a=[];a=a.filter(x=>x&&x.id!==item.id);if(!ok)a.push(item);localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
const lines=['What is your name?','My name is Alex.','Where are you from?','I am from Taipei.','What is your phone number?'];const el=id=>document.getElementById(id);let idx=0,score=0,checked=false;
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^whats /,'what is ').replace(/^im /,'i am ')}
function speak(rate){if(!('speechSynthesis'in window)){el('feedback').textContent='目前瀏覽器不支援英文朗讀';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lines[idx]);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function record(){let v=null;try{v=localStorage.getItem('adultEnglishL1DictationBest')}catch(e){}el('record').textContent='最佳聽寫成績：'+(v===null?'尚未完成':v+' / 5')}
function render(){checked=false;el('counter').textContent='第 '+(idx+1)+' / 5 題';el('answer').value='';el('answer').disabled=false;el('check').disabled=false;el('normal').disabled=false;el('slow').disabled=false;el('feedback').textContent='';el('feedback').className='';el('next').hidden=true}
function finish(){el('counter').textContent='練習完成';el('answer').disabled=true;el('check').disabled=true;el('normal').disabled=true;el('slow').disabled=true;el('next').hidden=true;el('feedback').className='good';el('feedback').textContent='本次聽寫得分：'+score+' / 5';try{localStorage.setItem('adultEnglishL1DictationBest',String(Math.max(score,Number(localStorage.getItem('adultEnglishL1DictationBest')||0))))}catch(e){}record()}
el('normal').addEventListener('click',()=>speak(.95));el('slow').addEventListener('click',()=>speak(.65));
el('check').addEventListener('click',()=>{if(checked)return;const input=norm(el('answer').value);if(!input){el('feedback').textContent='請先輸入答案';return}checked=true;const ok=input===norm(lines[idx]);if(ok)score++;trackMistake({id:'l1d'+idx,type:'dictation',prompt:lines[idx],answer:lines[idx]},ok);el('feedback').className=ok?'good':'bad';el('feedback').textContent=(ok?'✓ 答對了！':'未完全相同。')+' 正確句子：'+lines[idx];el('check').disabled=true;el('next').hidden=false});
el('next').addEventListener('click',()=>{if(!checked)return;idx++;if(idx>=lines.length)finish();else render()});
el('restart').addEventListener('click',()=>{idx=0;score=0;render()});render();record();
</script></body></html>
