<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文組句與拼寫｜AT-13</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25354e;font:16px system-ui,-apple-system,sans-serif}header{background:white;padding:18px 5%;font-weight:700;color:#3155b6}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7391e6);color:white;padding:24px;border-radius:18px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:16px}a,button{display:inline-block;border:0;border-radius:10px;background:#3155b6;color:white;padding:11px 14px;text-decoration:none;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7eeff;color:#3155b6}button:disabled{opacity:.5}.words{min-height:52px;padding:10px;border:1px dashed #a8b8d8;border-radius:10px;margin:10px 0}.word{background:#e6eeff;color:#28448d}.muted{color:#64728a}.good{color:#166d42}.bad{color:#a0442b}input{width:100%;padding:12px;border:1px solid #bfcbe1;border-radius:9px;font:inherit}p{line-height:1.6}[hidden]{display:none!important}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-13 · 原創句型練習</small><h1>Build & Spell</h1><p>英文組句與拼寫糾錯｜共八題</p></div><section class="card"><h2>操作說明</h2><p>前四題點選單字依序組成完整句子；後四題將錯誤拼寫改成正確英文。每題一分，完成後保留最佳成績。</p></section><section class="card"><p id="counter"></p><h2 id="prompt"></h2><p id="hint" class="muted"></p><div id="build" hidden><p>已選單字：</p><div id="chosen" class="words" aria-live="polite"></div><p>可選單字：</p><div id="bank" class="words"></div><button class="secondary" id="undo">退回上一個字</button><button class="secondary" id="clear">清空組句</button></div><div id="spell" hidden><label for="typed">輸入正確的英文句子</label><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false"></div><p><button id="check">檢查答案</button><button id="next" hidden>下一題</button></p><p id="feedback" aria-live="polite"></p></section><section class="card"><h2>📈 最佳成績</h2><p id="record"></p><button id="restart" class="secondary">重新練習</button><p class="muted">此頁使用獨立的本機儲存鍵值，不會修改其他單元成績。</p></section></main><script>
const qs=[
{type:'build',hint:'我叫 Alex。',answer:'My name is Alex.',words:['Alex.','is','My','name']},
{type:'build',hint:'我來自台北。',answer:'I am from Taipei.',words:['Taipei.','from','I','am']},
{type:'build',hint:'我在工廠工作。',answer:'I work at a factory.',words:['factory.','work','I','a','at']},
{type:'build',hint:'我們三點見面吧。',answer:"Let's meet at three o'clock.",words:["o'clock.",'three','meet',"Let's",'at']},
{type:'spell',hint:'請修正拼寫：My neme is Alex.',answer:'My name is Alex.'},
{type:'spell',hint:'請修正拼寫：I am fom Taipei.',answer:'I am from Taipei.'},
{type:'spell',hint:'請修正拼寫：What tim is it?',answer:'What time is it?'},
{type:'spell',hint:'請修正拼寫：See you tomorow.',answer:'See you tomorrow.'}
];const el=id=>document.getElementById(id);let pos=0,score=0,locked=false,selected=[];
function normalize(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function record(){let v=null;try{v=localStorage.getItem('adultEnglishBuildSpellBest')}catch(e){}el('record').textContent=v===null?'尚未測驗':'最佳成績：'+v+' / '+qs.length}
function words(){const q=qs[pos];el('chosen').textContent=selected.map(i=>q.words[i]).join(' ');el('bank').innerHTML='';q.words.forEach((w,i)=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.disabled=selected.includes(i)||locked;b.addEventListener('click',()=>{selected.push(i);words()});el('bank').appendChild(b)})}
function finish(){el('counter').textContent='練習完成';el('prompt').textContent='本次得分：'+score+' / '+qs.length;el('hint').textContent='';el('build').hidden=true;el('spell').hidden=true;el('check').hidden=true;el('next').hidden=true;el('feedback').textContent='可按「重新練習」再挑戰。';try{localStorage.setItem('adultEnglishBuildSpellBest',String(Math.max(score,Number(localStorage.getItem('adultEnglishBuildSpellBest')||0))))}catch(e){}record()}
function render(){if(pos>=qs.length){finish();return}locked=false;selected=[];const q=qs[pos];el('counter').textContent='第 '+(pos+1)+' / '+qs.length+' 題';el('prompt').textContent=q.type==='build'?'單字排序組句':'拼寫糾錯';el('hint').textContent=q.hint;el('feedback').textContent='';el('feedback').className='';el('build').hidden=q.type!=='build';el('spell').hidden=q.type!=='spell';el('check').hidden=false;el('check').disabled=false;el('next').hidden=true;if(q.type==='build')words();else{el('typed').value='';el('typed').disabled=false}}
el('undo').addEventListener('click',()=>{if(!locked){selected.pop();words()}});el('clear').addEventListener('click',()=>{if(!locked){selected=[];words()}});
el('check').addEventListener('click',()=>{if(locked||pos>=qs.length)return;const q=qs[pos],answer=q.type==='build'?selected.map(i=>q.words[i]).join(' '):el('typed').value.trim();if(!answer){el('feedback').textContent='請先完成作答';return}locked=true;const ok=normalize(answer)===normalize(q.answer);if(ok)score++;el('feedback').className=ok?'good':'bad';el('feedback').textContent=(ok?'✓ 答對了！':'尚未答對。')+' 正確句子：'+q.answer;el('check').disabled=true;el('typed').disabled=true;if(q.type==='build')words();el('next').hidden=false});
el('next').addEventListener('click',()=>{if(!locked||pos>=qs.length)return;pos++;render()});el('restart').addEventListener('click',()=>{pos=0;score=0;render()});record();render();
</script></body></html>
