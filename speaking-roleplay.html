<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文情境口說｜AT-17</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25354e;font:16px system-ui,-apple-system,sans-serif}header{background:#fff;padding:18px 5%;color:#3155b6;font-weight:700}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7291e6);color:white;padding:24px;border-radius:18px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:16px}a,button{display:inline-block;background:#3155b6;color:white;border:0;border-radius:10px;padding:11px 14px;text-decoration:none;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7eeff;color:#3155b6}button:disabled{opacity:.55}input{width:100%;padding:12px;border:1px solid #bfcbe1;border-radius:9px;font:inherit}.muted{color:#64728c}.good{color:#176c40}.diff{display:flex;gap:7px;flex-wrap:wrap}.token{padding:5px 8px;border-radius:8px;background:#e8eef7}.match{background:#d7f1e3}.missing{background:#ffe7c9}.extra{background:#f9dfdf}p{line-height:1.6}[hidden]{display:none!important}.compare-line{margin:12px 0}.compare-title{font-weight:700;font-size:14px;margin-bottom:7px}.compare-words{display:flex;flex-wrap:wrap;gap:7px}.token.actual-error{background:#fce0e0;color:#8d2d2d}.token.expected-error{background:#ffe6cc;color:#85430d}.token.empty{background:#f0f2f6;color:#7a8495;border:1px dashed #c5cbd6}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-17 · 情境口說</small><h1>Coffee Shop Role-play</h1><p>聽店員提問，開口用英文回答</p></div><section class="card"><p class="muted">採用瀏覽器語音辨識。文字匹配結果不是發音準確度；音訊處理方式取決於瀏覽器。請勿說出真實個資。</p><p id="support"></p><p id="step"></p><h2 id="staff"></h2><button id="hear">▶ 聽店員提問</button><button id="start">🎤 開始回答</button><button id="stop" class="secondary" disabled>停止辨識</button><p id="status" aria-live="polite"></p><label for="answer">辨識出的英文（亦可手動輸入）</label><input id="answer" autocomplete="off" autocapitalize="off"><p><button id="check">檢查回答</button><button id="next" class="secondary">下一段</button></p><p id="feedback" aria-live="polite"></p><div id="diff"></div><p class="muted">綠色：相同；第一行紅色：說錯或多說；第二行橘色：對照答案。系統從預先編寫的合理回答中挑選最接近的一句，並非 AI 自由語意理解。</p></section><section class="card"><h2>📈 最佳紀錄</h2><p id="record"></p><p class="muted">僅保存麥克風辨識的最佳文字匹配率，不儲存錄音或逐字內容。</p></section></main><script>
const lines=[["Hello! What would you like?","I'd like a cup of coffee, please."],["Would you like it hot or iced?","Iced, please."],["Anything else?","No, thank you."],["Your total is four dollars. How would you like to pay?","By card, please."]],el=id=>document.getElementById(id),Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let idx=0,rec=null,listening=false,mic=false,finalHandled=false;
const alternatives=[["I'd like a cup of coffee, please.","A coffee, please.","Can I have a coffee, please?"],["Iced, please.","I'd like it iced, please.","An iced coffee, please.","Hot, please.","I'd like it hot, please."],["No, thank you.","No, thanks.","That's all, thank you.","Yes, a cookie, please."],["By card, please.","I'll pay by card.","Cash, please.","I'll pay cash."]];
function score(a,b){const x=words(a),y=words(b),n=x.length,m=y.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(x[i-1]===y[j-1]?0:1));return Math.round(100*(1-d[n][m]/Math.max(n,m,1)))}
function words(s){const numberWords=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];const numberMap=Object.fromEntries(numberWords.map((w,i)=>[String(i),w]));return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean).map(w=>numberMap[w]||w)}
function diff(actual,target){const a=words(actual),b=words(target),n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=n,j=m,pairs=[];while(i||j){if(i&&j&&a[i-1]===b[j-1])pairs.push([a[--i],b[--j],'match']);else if(i&&j&&d[i][j]===d[i-1][j-1]+1)pairs.push([a[--i],b[--j],'different']);else if(i&&d[i][j]===d[i-1][j]+1)pairs.push([a[--i],null,'extra']);else pairs.push([null,b[--j],'missing'])}pairs.reverse();const out=el('diff');out.replaceChildren();[['第一行｜你實際說的',0],['第二行｜正確英文',1]].forEach(([label,side])=>{const line=document.createElement('div');line.className='compare-line';const title=document.createElement('div');title.className='compare-title';title.textContent=label;line.appendChild(title);const row=document.createElement('div');row.className='compare-words';pairs.forEach(([actual,expected,kind])=>{const s=document.createElement('span');const w=side===0?actual:expected;s.className=w?'token '+(kind==='match'?'match':side===0?'actual-error':'expected-error'):'token empty';s.textContent=w||'—';row.appendChild(s)});line.appendChild(row);out.appendChild(line)});return Math.round(100*(1-d[n][m]/Math.max(n,m,1)))}
function speak(t){if(!('speechSynthesis'in window)){el('status').textContent='此瀏覽器不支援朗讀';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function listen(v){listening=v;el('start').disabled=v||!Speech;el('stop').disabled=!v;el('next').disabled=v}
function stop(){if(rec&&listening)try{rec.stop()}catch(e){}listen(false)}
function record(){let v=null;try{v=localStorage.getItem('adultEnglishRoleplayBest')}catch(e){}el('record').textContent=v===null?'尚無麥克風練習紀錄':'最佳文字匹配率：'+v+'%'}
function render(){el('step').textContent='第 '+(idx+1)+' / '+lines.length+' 段';el('staff').textContent='店員：'+lines[idx][0];el('answer').value='';el('feedback').textContent='';el('status').textContent='';el('diff').replaceChildren();mic=false}
el('support').textContent=Speech?'語音辨識介面可用，請實際測試麥克風。':'目前瀏覽器不支援語音辨識，可用手動輸入練習。';
el('hear').addEventListener('click',()=>speak(lines[idx][0]));
el('start').addEventListener('click',()=>{if(!Speech)return;try{if('speechSynthesis'in window)speechSynthesis.cancel();rec=new Speech();finalHandled=false;rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onresult=e=>{let latest='',finalText='';for(let k=0;k<e.results.length;k++){const item=e.results[k];if(!item||!item[0])continue;latest+=item[0].transcript+' ';if(item.isFinal)finalText+=item[0].transcript+' '}el('answer').value=(finalText||latest).trim();el('status').textContent=finalText?'辨識完成，已自動比較。':'正在辨識：'+latest.trim();if(finalText.trim()&&!finalHandled){finalHandled=true;mic=true;listen(false);el('check').click();try{rec.stop()}catch(err){}}};rec.onerror=e=>{el('status').textContent='辨識失敗：'+e.error;listen(false)};rec.onend=()=>listen(false);rec.start();listen(true);el('status').textContent='正在聆聽，說話時會顯示即時文字…'}catch(e){listen(false);el('status').textContent='無法啟動：'+e.message}});
el('stop').addEventListener('click',stop);el('answer').addEventListener('input',e=>{if(e.isTrusted)mic=false});
el('check').addEventListener('click',()=>{const v=el('answer').value.trim();if(!v){el('feedback').textContent='請先回答';return}const best=alternatives[idx].map(t=>({text:t,pct:score(v,t)})).sort((a,b)=>b.pct-a.pct)[0];const pct=diff(v,best.text);el('feedback').textContent=(pct>=90?'符合一種自然回答。':'可再練習這種回答。')+' 文字匹配率：'+pct+'%。對照句：'+best.text+(mic?'（麥克風）':'（手動輸入，不計分）');if(mic){try{const k='adultEnglishRoleplayBest';localStorage.setItem(k,String(Math.max(pct,Number(localStorage.getItem(k)||0))))}catch(e){}record()}});
el('next').addEventListener('click',()=>{stop();idx=(idx+1)%lines.length;render()});record();render();
</script></body></html>
