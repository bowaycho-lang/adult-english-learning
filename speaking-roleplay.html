<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文情境口說｜AT-17</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25354e;font:16px system-ui,-apple-system,sans-serif}header{background:#fff;padding:18px 5%;color:#3155b6;font-weight:700}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7291e6);color:white;padding:24px;border-radius:18px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:16px}a,button{display:inline-block;background:#3155b6;color:white;border:0;border-radius:10px;padding:11px 14px;text-decoration:none;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7eeff;color:#3155b6}button:disabled{opacity:.55}input{width:100%;padding:12px;border:1px solid #bfcbe1;border-radius:9px;font:inherit}.muted{color:#64728c}.good{color:#176c40}.diff{display:flex;gap:7px;flex-wrap:wrap}.token{padding:5px 8px;border-radius:8px;background:#e8eef7}.match{background:#d7f1e3}.missing{background:#ffe7c9}.extra{background:#f9dfdf}p{line-height:1.6}[hidden]{display:none!important}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-17 · 情境口說</small><h1>Coffee Shop Role-play</h1><p>聽店員提問，開口用英文回答</p></div><section class="card"><p class="muted">採用瀏覽器語音辨識。文字匹配結果不是發音準確度；音訊處理方式取決於瀏覽器。請勿說出真實個資。</p><p id="support"></p><p id="step"></p><h2 id="staff"></h2><button id="hear">▶ 聽店員提問</button><button id="start">🎤 開始回答</button><button id="stop" class="secondary" disabled>停止辨識</button><p id="status" aria-live="polite"></p><label for="answer">辨識出的英文（亦可手動輸入）</label><input id="answer" autocomplete="off" autocapitalize="off"><p><button id="check">檢查回答</button><button id="next" class="secondary">下一段</button></p><p id="feedback" aria-live="polite"></p><div id="diff" class="diff"></div><p class="muted">綠色：符合；橘色：遺漏；紅色：額外文字。</p></section><section class="card"><h2>📈 最佳紀錄</h2><p id="record"></p><p class="muted">僅保存麥克風辨識的最佳文字匹配率，不儲存錄音或逐字內容。</p></section></main><script>
const lines=[["Hello! What would you like?","I'd like a cup of coffee, please."],["Would you like it hot or iced?","Iced, please."],["Anything else?","No, thank you."],["How much is it?","It's four dollars."]],el=id=>document.getElementById(id),Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let idx=0,rec=null,listening=false,mic=false;
function words(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean)}
function diff(actual,target){const a=words(actual),b=words(target),d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);let i=a.length,j=b.length,ops=[];while(i||j){if(i&&j&&a[i-1]===b[j-1]){ops.push(['match',b[--j]]);i--}else if(j&&(!i||d[i][j-1]>=d[i-1][j]))ops.push(['missing',b[--j]]);else ops.push(['extra',a[--i]])}const out=el('diff');out.replaceChildren();ops.reverse().forEach(([type,word])=>{const s=document.createElement('span');s.className='token '+type;s.textContent=word;out.appendChild(s)});return Math.round(100*d[a.length][b.length]/Math.max(a.length,b.length,1))}
function speak(t){if(!('speechSynthesis'in window)){el('status').textContent='此瀏覽器不支援朗讀';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function listen(v){listening=v;el('start').disabled=v||!Speech;el('stop').disabled=!v;el('next').disabled=v}
function stop(){if(rec&&listening)try{rec.stop()}catch(e){}listen(false)}
function record(){let v=null;try{v=localStorage.getItem('adultEnglishRoleplayBest')}catch(e){}el('record').textContent=v===null?'尚無麥克風練習紀錄':'最佳文字匹配率：'+v+'%'}
function render(){el('step').textContent='第 '+(idx+1)+' / '+lines.length+' 段';el('staff').textContent='店員：'+lines[idx][0];el('answer').value='';el('feedback').textContent='';el('status').textContent='';el('diff').replaceChildren();mic=false}
el('support').textContent=Speech?'語音辨識介面可用，請實際測試麥克風。':'目前瀏覽器不支援語音辨識，可用手動輸入練習。';
el('hear').addEventListener('click',()=>speak(lines[idx][0]));
el('start').addEventListener('click',()=>{if(!Speech)return;try{if('speechSynthesis'in window)speechSynthesis.cancel();rec=new Speech();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{el('answer').value=e.results[0][0].transcript;mic=true;el('status').textContent='辨識完成，請檢查回答'};rec.onerror=e=>{el('status').textContent='辨識失敗：'+e.error;listen(false)};rec.onend=()=>listen(false);rec.start();listen(true);el('status').textContent='正在聆聽…'}catch(e){listen(false);el('status').textContent='無法啟動：'+e.message}});
el('stop').addEventListener('click',stop);el('answer').addEventListener('input',e=>{if(e.isTrusted)mic=false});
el('check').addEventListener('click',()=>{const v=el('answer').value.trim();if(!v){el('feedback').textContent='請先回答';return}const pct=diff(v,lines[idx][1]);el('feedback').textContent='文字匹配率：'+pct+'%。建議回答：'+lines[idx][1]+(mic?'（麥克風）':'（手動輸入，不計分）');if(mic){try{const k='adultEnglishRoleplayBest';localStorage.setItem(k,String(Math.max(pct,Number(localStorage.getItem(k)||0))))}catch(e){}record()}});
el('next').addEventListener('click',()=>{stop();idx=(idx+1)%lines.length;render()});record();render();
</script></body></html>
