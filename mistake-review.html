<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文錯題複習｜AT-10</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25334c;font:16px system-ui,-apple-system,sans-serif}header{background:white;padding:18px 5%;font-weight:bold;color:#3155b6}main{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7590e2);color:white;border-radius:18px;padding:23px}.card{background:white;border:1px solid #dce5f2;border-radius:16px;padding:19px;margin-top:15px}a,button{display:inline-block;border:0;background:#3155b6;color:white;border-radius:10px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer;margin:5px 5px 5px 0}.option{display:block;width:100%;background:#e8eeff;color:#263e85;text-align:left}.muted{color:#64728c}.good{color:#176a42}.bad{color:#a04c27}input{width:100%;padding:12px;border:1px solid #bdc9e0;border-radius:9px;font:inherit}p{line-height:1.6}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 課程總覽</a><div class="hero"><small>AT-10 · 錯題複習</small><h1>Review My Mistakes</h1><p>針對答錯的題目重新練習，答對後移出待複習清單。</p></div><section class="card"><h2>待複習清單</h2><p id="count"></p><div id="list"></div><p class="muted">僅收集 AT-10 上線後的第一課選擇題與聽寫錯題。原有成績不受影響。</p></section><section class="card"><h2>開始複習</h2><div id="practice"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>下一題</button></section></main><script>
const key='adultEnglishMistakesV1',el=id=>document.getElementById(id);let items=[],pos=0,done=false;
function read(){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x.filter(v=>v&&typeof v.id==='string'&&['quiz','dictation'].includes(v.type)):[]}catch(e){return []}}
function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){el('feedback').textContent='無法儲存，請檢查瀏覽器隱私設定'}}
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^whats /,'what is ').replace(/^im /,'i am ')}
function say(s){if(!('speechSynthesis'in window)){el('feedback').textContent='此瀏覽器不支援朗讀';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function summary(){el('count').textContent='目前待複習：'+items.length+' 題';el('list').textContent=items.length?items.map(x=>(x.type==='quiz'?'選擇題：':'聽寫：')+x.prompt).join(' ｜ '):'目前沒有待複習錯題。請先完成第一課測驗或聽寫。'}
function render(){summary();done=false;el('next').hidden=true;el('feedback').textContent='';if(!items.length){el('practice').innerHTML='<p class="good">目前沒有待複習題目。</p>';return}if(pos>=items.length)pos=0;const x=items[pos];if(x.type==='quiz'){el('practice').innerHTML='<h3>'+x.prompt+'</h3>'+x.options.map((o,i)=>'<button class="option" data-option="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')}else{el('practice').innerHTML='<h3>英文聽寫</h3><p>請先聽句子，再輸入英文。</p><button id="play">▶ 播放</button><input id="typed" autocomplete="off" placeholder="輸入聽到的句子"><button id="check">檢查答案</button>';el('play').addEventListener('click',()=>say(x.prompt));el('check').addEventListener('click',()=>{const t=el('typed').value.trim();if(!t){el('feedback').textContent='請先輸入答案';return}grade(norm(t)===norm(x.answer),x.answer)})}}
function grade(ok,answer){if(done)return;done=true;el('feedback').className=ok?'good':'bad';el('feedback').textContent=ok?'✓ 答對了！已從錯題清單移除。':'尚未答對。正確答案：'+answer;if(ok){items.splice(pos,1);save()}else pos++;summary();el('next').hidden=false;for(const b of el('practice').querySelectorAll('button'))b.disabled=true}
el('practice').addEventListener('click',e=>{const b=e.target.closest('[data-option]');if(!b||done)return;const x=items[pos];grade(Number(b.dataset.option)===x.correct,x.options[x.correct])});
el('next').addEventListener('click',render);items=read();render();
</script></body></html>
