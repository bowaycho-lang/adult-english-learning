<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AT-19 口說弱點複習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#26354e;font:16px system-ui,-apple-system,sans-serif}header{padding:18px 5%;background:white;color:#3155b6;font-weight:700}main{max-width:800px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7692e2);padding:24px;color:white;border-radius:18px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:18px;margin-top:15px}.item{padding:14px 0;border-bottom:1px solid #e6ebf4}.item:last-child{border:0}a.button,button{display:inline-block;border:0;background:#3155b6;color:white;padding:10px 13px;border-radius:10px;text-decoration:none;font:inherit;margin:6px 6px 0 0}.muted{color:#63728b}.pill{display:inline-block;background:#e7eeff;color:#3155b6;padding:5px 9px;border-radius:12px;font-size:13px}.warn{color:#96531b}p{line-height:1.6}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-19 · 間隔複習</small><h1>Speaking Review</h1><p>優先練習弱點句型，安排下一次複習</p></div><section class="card"><h2>今日複習</h2><p id="summary"></p><p class="muted">建議節奏：首次完成後 1 天、再隔 3 天、再隔 7 天。這是簡化複習計畫，不代表已證實的個人最佳間隔。</p></section><section class="card"><h2>六句口說練習</h2><div id="items"></div></section><section class="card"><h2>使用說明</h2><p>點「開始練習」進入口說頁完成辨識，再返回此頁。只有當本句出現新的麥克風練習紀錄，才能標記本輪完成。未曾練習或最近匹配率低於 80% 的句子會優先顯示。</p><p class="muted">進度僅保存在本機瀏覽器；不會修改原有成績。複習排程可使用既有 JSON 備份功能匯出。</p></section></main><script>
const sentences=['My name is Alex.','I am from Taipei.','I work at a factory.',"Let's meet at three o'clock.","I'd like a cup of coffee, please.",'Can I pay by card?'],el=id=>document.getElementById(id),KEY='adultEnglishSpeakingReviewV1',PROGRESS='adultEnglishSpeakingProgressV1';
function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}}
function save(x){try{localStorage.setItem(KEY,JSON.stringify(x));return true}catch(e){return false}}
function day(t){const d=new Date(t);return Number.isFinite(d.getTime())?d.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}):'未知'}
function due(p,r){return !p||!p.count||!r||!r.nextDue||Date.now()>=r.nextDue}
function render(){const p=get(PROGRESS),r=get(KEY),out=el('items');out.replaceChildren();let count=0;const ordered=sentences.map((sentence,id)=>({sentence,id,p:p[String(id)],r:r[String(id)]})).sort((a,b)=>{const da=due(a.p,a.r),db=due(b.p,b.r);if(da!==db)return da?-1:1;return (a.p?.last??-1)-(b.p?.last??-1)});ordered.forEach(({sentence,id,p:stats,r:review})=>{const isDue=due(stats,review);if(isDue)count++;const wrap=document.createElement('div');wrap.className='item';const title=document.createElement('h3');title.textContent=(id+1)+'. '+sentence;wrap.appendChild(title);const info=document.createElement('p');info.className='muted';info.textContent=stats&&stats.count?'練習 '+stats.count+' 次｜最近 '+stats.last+'%｜最佳 '+stats.best+'%':'尚未練習';wrap.appendChild(info);const status=document.createElement('span');status.className='pill';status.textContent=isDue?'待複習':'下次複習：'+day(review.nextDue);wrap.appendChild(status);const actions=document.createElement('div');const link=document.createElement('a');link.className='button';link.href='./speaking-practice.html?sentence='+(id+1);link.textContent='開始練習';actions.appendChild(link);if(isDue&&stats&&stats.count){const btn=document.createElement('button');btn.textContent='完成本輪複習';btn.disabled=!!(review&&stats.count<=review.lastCount);btn.addEventListener('click',()=>{const latest=get(PROGRESS)[String(id)];if(!latest||latest.count<=(get(KEY)[String(id)]?.lastCount||0))return;const state=get(KEY),prev=state[String(id)]||{},step=latest.last>=80?Math.min((prev.step||0)+1,3):0,days=[0,1,3,7][step];state[String(id)]={step,lastCount:latest.count,nextDue:Date.now()+days*86400000};if(save(state))render()});actions.appendChild(btn)}wrap.appendChild(actions);out.appendChild(wrap)});el('summary').textContent='目前待複習：'+count+' / '+sentences.length+' 句'}
window.addEventListener('pageshow',render);render();
</script></body></html>
