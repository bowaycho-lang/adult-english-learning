<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成人英文｜咖啡店點餐</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25354e;font:16px system-ui,-apple-system,sans-serif}header{background:#fff;padding:18px 5%;font-weight:700;color:#3155b6}main{max-width:780px;margin:auto;padding:16px}.hero{background:linear-gradient(110deg,#3155b6,#7795e4);color:#fff;padding:24px;border-radius:18px}.card{background:#fff;border:1px solid #dce4f2;border-radius:16px;padding:20px;margin-top:16px}a,button{display:inline-block;border:0;border-radius:10px;background:#3155b6;color:#fff;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary,.choice{background:#e7eeff;color:#28468e}.choice{display:block;width:100%;text-align:left}.muted{color:#64738b}.line{padding:12px 0;border-bottom:1px solid #e9edf6}p{line-height:1.6}.good{color:#176b42}.bad{color:#a0472c}button:disabled{opacity:.65}[hidden]{display:none!important}</style></head><body><header>Everyday English · 成人英文</header><main><a href="./dashboard.html">← 返回課程總覽</a><div class="hero"><small>AT-15 · 原創補充單元 4</small><h1>At a Coffee Shop</h1><p>咖啡店點餐｜聽力、對話、角色扮演與測驗</p></div><section class="card"><h2>🎯 學習目標</h2><p>能用英文點飲料、詢問價格、選擇冷熱飲，並完成簡單結帳。</p><p class="muted">原創練習內容，尚未對應教材正式章節。語音使用瀏覽器內建美式英文朗讀。</p></section><section class="card"><h2>🔊 常用句型</h2><div id="phrases"></div></section><section class="card"><h2>💬 完整情境對話</h2><div id="dialogue"></div><button id="all">▶ 播放完整對話</button><button id="stop" class="secondary">停止播放</button></section><section class="card"><h2>🎭 角色扮演</h2><p>你扮演顧客。先聽店員問題，再按「顯示建議回答」，跟著朗讀。</p><p id="rolePrompt"></p><button id="hear">▶ 聽店員提問</button><button id="reveal" class="secondary">顯示建議回答</button><p id="roleAnswer" hidden></p><button id="sayAnswer" hidden>▶ 朗讀建議回答</button><button id="roleNext" class="secondary">下一段對話</button><p class="muted">此版本是跟讀練習，尚未進行麥克風錄音或發音評分。</p></section><section class="card"><h2>✍️ 五題測驗</h2><p id="counter"></p><div id="quiz"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>下一題</button><button id="restart" class="secondary">重新測驗</button></section><section class="card"><h2>📈 學習紀錄</h2><p id="record"></p><p class="muted">此單元使用獨立儲存鍵值，不會修改先前課程成績。</p></section></main><script>
const el=id=>document.getElementById(id),phrases=[["I'd like a cup of coffee, please.","我想要一杯咖啡，謝謝。"],["Would you like it hot or iced?","你要熱的還是冰的？"],["Iced, please.","冰的，謝謝。"],["How much is it?","多少錢？"],["It's four dollars.","四美元。"],["Can I pay by card?","可以刷卡嗎？"]];
const lines=[["Staff","Hello! What would you like?"],["Customer","I'd like a cup of coffee, please."],["Staff","Would you like it hot or iced?"],["Customer","Iced, please."],["Staff","Anything else?"],["Customer","No, thank you. How much is it?"],["Staff","It's four dollars."],["Customer","Can I pay by card?"]];
function say(s,rate=.85){if(!('speechSynthesis'in window)){el('feedback').textContent='瀏覽器不支援語音朗讀';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
el('phrases').innerHTML=phrases.map((x,i)=>'<p><b>'+x[0]+'</b><br><span class="muted">'+x[1]+'</span> <button data-phrase="'+i+'">▶ 朗讀</button></p>').join('');
el('phrases').addEventListener('click',e=>{const b=e.target.closest('[data-phrase]');if(b)say(phrases[Number(b.dataset.phrase)][0])});
el('dialogue').innerHTML=lines.map((x,i)=>'<div class="line"><b>'+x[0]+':</b> '+x[1]+' <button data-line="'+i+'">▶</button></div>').join('');
el('dialogue').addEventListener('click',e=>{const b=e.target.closest('[data-line]');if(b)say(lines[Number(b.dataset.line)][1])});
el('all').addEventListener('click',()=>say(lines.map(x=>x[1]).join(' ... '),.82));el('stop').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});
const roles=[[lines[0][1],lines[1][1]],[lines[2][1],lines[3][1]],[lines[4][1],lines[5][1]],[lines[6][1],lines[7][1]]];let role=0;function roleRender(){el('rolePrompt').textContent='店員：'+roles[role][0];el('roleAnswer').textContent='你可以說：'+roles[role][1];el('roleAnswer').hidden=true;el('sayAnswer').hidden=true}el('hear').addEventListener('click',()=>say(roles[role][0]));el('reveal').addEventListener('click',()=>{el('roleAnswer').hidden=false;el('sayAnswer').hidden=false});el('sayAnswer').addEventListener('click',()=>say(roles[role][1]));el('roleNext').addEventListener('click',()=>{role=(role+1)%roles.length;roleRender()});roleRender();
const qs=[["I'd like a cup of coffee, please. 表示？",["我想要一杯咖啡","我不喝咖啡","咖啡太貴"],0],["Would you like it hot or iced? 在問？",["大小杯","冷或熱","價格"],1],["Iced, please. 表示？",["熱的，謝謝","冰的，謝謝","不要冰塊"],1],["How much is it? 表示？",["多少錢？","現在幾點？","你要什麼？"],0],["Can I pay by card? 表示？",["可以刷卡嗎？","可以外帶嗎？","可以加糖嗎？"],0]];
let index=0,score=0,answered=false;function record(){let v=null;try{v=localStorage.getItem('adultEnglishExtra4')}catch(e){}el('record').textContent='補充單元 4 最佳成績：'+(v===null?'尚未測驗':v+' / 5')}
function render(){answered=false;el('feedback').textContent='';el('next').hidden=true;if(index>=qs.length){el('counter').textContent='測驗完成';el('quiz').innerHTML='<h3>本次得分：'+score+' / 5</h3>';try{localStorage.setItem('adultEnglishExtra4',String(Math.max(score,Number(localStorage.getItem('adultEnglishExtra4')||0))))}catch(e){}record();return}const q=qs[index];el('counter').textContent='第 '+(index+1)+' / 5 題';el('quiz').innerHTML='<h3>'+q[0]+'</h3>'+q[1].map((v,i)=>'<button class="choice" data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+v+'</button>').join('')}
el('quiz').addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(!b||answered)return;answered=true;const q=qs[index],ok=Number(b.dataset.choice)===q[2];if(ok)score++;el('quiz').querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);el('feedback').className=ok?'good':'bad';el('feedback').textContent=ok?'答對了！':'正確答案：'+q[1][q[2]];el('next').hidden=false});el('next').addEventListener('click',()=>{if(index>=qs.length)return;index++;render()});el('restart').addEventListener('click',()=>{index=0;score=0;render()});render();record();
</script></body></html>
